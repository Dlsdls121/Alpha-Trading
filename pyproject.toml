[project]
name = "alpha-trading"
version = "0.1.0"
description = "Advisory signal engine for NSE index options and positional equities. Analysis only - never places orders."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alpha"]

# The dashboard has to travel with the package. Without this a `pip install`
# puts alpha/ in site-packages and leaves web/ behind, so the API works and
# every page request 404s -- which is what happens on any container deploy.
[tool.hatch.build.targets.wheel.force-include]
"web" = "alpha/web"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
